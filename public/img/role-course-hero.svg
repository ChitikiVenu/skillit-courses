<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 880" width="900" height="880" role="img" aria-labelledby="t d">
  <title id="t">Role course learning path</title>
  <desc id="d">A learning path that runs from foundations through core skills, tools and labs, projects and a real-time internship to a job-ready finish.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf1ff"/>
      <stop offset="1" stop-color="#f6f9ff"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0c9a83"/>
      <stop offset="1" stop-color="#0148fa"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0148fa"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#10151f" flood-opacity="0.16"/>
    </filter>
    <filter id="sm" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#10151f" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="900" height="880" rx="28" fill="url(#bg)"/>
  <circle cx="770" cy="120" r="150" fill="#0148fa" opacity="0.06"/>
  <circle cx="120" cy="760" r="170" fill="#0c9a83" opacity="0.07"/>

  <!-- main panel -->
  <g filter="url(#sh)">
    <rect x="70" y="70" width="760" height="740" rx="26" fill="#ffffff"/>
  </g>
  <rect x="70" y="70" width="760" height="62" rx="26" fill="#f3f6fb"/>
  <rect x="70" y="106" width="760" height="26" fill="#f3f6fb"/>
  <circle cx="108" cy="101" r="8" fill="#c0392b"/>
  <circle cx="134" cy="101" r="8" fill="#e0a021"/>
  <circle cx="160" cy="101" r="8" fill="#0c9a83"/>
  <text x="200" y="107" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#10151f">Your role learning path</text>
  <rect x="640" y="86" width="164" height="30" rx="15" fill="#e6f7f3"/>
  <circle cx="660" cy="101" r="5" fill="#0c9a83"/>
  <text x="674" y="106" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0a7a68">Hands-on labs</text>

  <!-- winding path -->
  <path d="M170 730 C 170 640, 330 660, 330 580 S 200 500, 300 430 S 560 470, 560 380 S 460 300, 560 240 S 700 210, 720 160"
        fill="none" stroke="#dfe7f5" stroke-width="22" stroke-linecap="round"/>
  <path d="M170 730 C 170 640, 330 660, 330 580 S 200 500, 300 430 S 560 470, 560 380 S 460 300, 560 240 S 700 210, 720 160"
        fill="none" stroke="url(#path)" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 18"/>

  <!-- nodes -->
  <g font-family="Inter, Arial, sans-serif">
    <g filter="url(#sm)">
      <circle cx="170" cy="730" r="30" fill="url(#node)"/>
    </g>
    <text x="170" y="740" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">1</text>
    <g filter="url(#sm)"><rect x="214" y="704" width="210" height="52" rx="14" fill="#fff"/></g>
    <text x="234" y="727" font-size="16" font-weight="800" fill="#10151f">Foundations</text>
    <text x="234" y="746" font-size="12.5" font-weight="500" fill="#5b6478">Networks, code, data basics</text>

    <g filter="url(#sm)"><circle cx="330" cy="580" r="30" fill="url(#node)"/></g>
    <text x="330" y="590" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">2</text>
    <g filter="url(#sm)"><rect x="374" y="554" width="220" height="52" rx="14" fill="#fff"/></g>
    <text x="394" y="577" font-size="16" font-weight="800" fill="#10151f">Core skills</text>
    <text x="394" y="596" font-size="12.5" font-weight="500" fill="#5b6478">The heart of your role</text>

    <g filter="url(#sm)"><circle cx="300" cy="430" r="30" fill="url(#node)"/></g>
    <text x="300" y="440" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">3</text>
    <g filter="url(#sm)"><rect x="100" y="404" width="160" height="52" rx="14" fill="#fff"/></g>
    <text x="118" y="427" font-size="16" font-weight="800" fill="#10151f">Tools + labs</text>
    <text x="118" y="446" font-size="12.5" font-weight="500" fill="#5b6478">Practise on real tools</text>

    <g filter="url(#sm)"><circle cx="560" cy="380" r="30" fill="url(#node)"/></g>
    <text x="560" y="390" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">4</text>
    <g filter="url(#sm)"><rect x="604" y="354" width="196" height="52" rx="14" fill="#fff"/></g>
    <text x="624" y="377" font-size="16" font-weight="800" fill="#10151f">Real projects</text>
    <text x="624" y="396" font-size="12.5" font-weight="500" fill="#5b6478">A portfolio to show</text>

    <g filter="url(#sm)"><circle cx="560" cy="240" r="30" fill="url(#node)"/></g>
    <text x="560" y="250" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">5</text>
    <g filter="url(#sm)"><rect x="330" y="214" width="188" height="52" rx="14" fill="#fff"/></g>
    <text x="350" y="237" font-size="16" font-weight="800" fill="#10151f">Internship</text>
    <text x="350" y="256" font-size="12.5" font-weight="500" fill="#5b6478">Real-time, on a team</text>
  </g>

  <!-- finish flag -->
  <g filter="url(#sm)">
    <circle cx="720" cy="160" r="38" fill="#ea580c"/>
  </g>
  <path d="M708 178 V142 M708 144 H738 L731 152 L738 160 H708" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#sm)"><rect x="606" y="196" width="128" height="34" rx="17" fill="#fff"/></g>
  <text x="670" y="218" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#ea580c" text-anchor="middle">Job-ready</text>

  <!-- decorative skill tiles -->
  <g filter="url(#sm)">
    <rect x="98" y="168" width="128" height="86" rx="16" fill="#fff"/>
  </g>
  <rect x="116" y="216" width="18" height="24" rx="4" fill="#0148fa"/>
  <rect x="142" y="200" width="18" height="40" rx="4" fill="#0c9a83"/>
  <rect x="168" y="184" width="18" height="56" rx="4" fill="#ea580c"/>
  <rect x="194" y="208" width="18" height="32" rx="4" fill="#2563eb"/>

  <g filter="url(#sm)">
    <rect x="98" y="276" width="128" height="86" rx="16" fill="#fff"/>
  </g>
  <text x="162" y="332" font-family="'IBM Plex Mono', Consolas, monospace" font-size="30" font-weight="700" fill="#0148fa" text-anchor="middle">&lt;/&gt;</text>

  <g filter="url(#sm)">
    <rect x="640" y="470" width="150" height="96" rx="16" fill="#fff"/>
  </g>
  <path d="M715 486 L752 500 V526 C752 546 736 558 715 566 C694 558 678 546 678 526 V500 Z" fill="#e6f7f3" stroke="#0c9a83" stroke-width="3"/>
  <path d="M700 526 L711 537 L731 514" fill="none" stroke="#0c9a83" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#sm)">
    <rect x="640" y="600" width="150" height="96" rx="16" fill="#fff"/>
  </g>
  <circle cx="678" cy="636" r="9" fill="#0148fa"/>
  <circle cx="752" cy="630" r="9" fill="#0c9a83"/>
  <circle cx="715" cy="678" r="9" fill="#ea580c"/>
  <path d="M678 636 L752 630 L715 678 Z" fill="none" stroke="#9db5e8" stroke-width="3"/>

  <!-- bottom strip -->
  <rect x="98" y="770" width="704" height="6" rx="3" fill="#eef2f8"/>
  <rect x="98" y="770" width="470" height="6" rx="3" fill="url(#path)"/>
</svg>
