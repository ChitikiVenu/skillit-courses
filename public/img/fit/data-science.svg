<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" role="img" aria-label="Illustration of a student working on a laptop">
  <defs>
    <linearGradient id="data-science-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8faf3" stop-opacity=".9"/>
      <stop offset="1" stop-color="#e8faf3" stop-opacity=".35"/>
    </linearGradient>
    <filter id="data-science-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0c9a83" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="320" height="260" fill="url(#data-science-bg)"/>
  <circle cx="248" cy="46" r="58" fill="#0c9a83" opacity=".08"/>
  <circle cx="46" cy="214" r="46" fill="#0c9a83" opacity=".08"/>

  <!-- desk -->
  <ellipse cx="160" cy="222" rx="118" ry="10" fill="#0c9a83" opacity=".12"/>
  <rect x="34" y="206" width="252" height="14" rx="7" fill="#1c2230"/>

  <!-- person -->
  <path d="M100,208 C100,156 126,120 160,120 C194,120 220,156 220,208 Z" fill="#14b89a"/>
  <path d="M148,208 L148,168 C148,160 153,155 160,155 C167,155 172,160 172,168 L172,208 Z" fill="#0c9a83"/>
  <circle cx="160" cy="92" r="21" fill="#8d5524"/>
  <circle cx="152" cy="94" r="1.7" fill="#20242c"/><circle cx="168" cy="94" r="1.7" fill="#20242c"/><path d="M154,101 Q160,104 166,101" stroke="#20242c" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <clipPath id="data-science-hair-clip"><circle cx="160" cy="92" r="21.5"/></clipPath><rect x="135" y="65" width="50" height="30" fill="#1c2230" clip-path="url(#data-science-hair-clip)"/><circle cx="138.7" cy="84.4" r="7.5" fill="#1c2230"/><circle cx="141.5" cy="79.4" r="7.5" fill="#1c2230"/><circle cx="146.2" cy="75.3" r="7.5" fill="#1c2230"/><circle cx="152.1" cy="72.6" r="7.5" fill="#1c2230"/><circle cx="158.8" cy="71.4" r="7.5" fill="#1c2230"/><circle cx="165.7" cy="72.0" r="7.5" fill="#1c2230"/><circle cx="172.0" cy="74.2" r="7.5" fill="#1c2230"/><circle cx="177.1" cy="77.9" r="7.5" fill="#1c2230"/><circle cx="180.5" cy="82.7" r="7.5" fill="#1c2230"/>

  <!-- laptop -->
  <g filter="url(#data-science-shadow)">
    <rect x="118" y="108" width="84" height="60" rx="7" fill="#161b26"/>
    <rect x="123" y="113" width="74" height="50" rx="3" fill="#ffffff"/>
    <g transform="translate(136,116) scale(1.9)" fill="none" color="#0c9a83"><circle cx="12" cy="12" r="2"/><ellipse cx="12" cy="12" rx="9" ry="3.6" fill="none" stroke="currentColor" stroke-width="1.6"/><ellipse cx="12" cy="12" rx="9" ry="3.6" fill="none" stroke="currentColor" stroke-width="1.6" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9" ry="3.6" fill="none" stroke="currentColor" stroke-width="1.6" transform="rotate(120 12 12)"/></g>
    <path d="M108,168 L212,168 L222,182 C222,186 218,188 214,188 L106,188 C102,188 98,186 98,182 Z" fill="#20242c"/>
  </g>

  <!-- floating badge -->
  <g filter="url(#data-science-shadow)">
    <circle cx="252" cy="98" r="24" fill="#ffffff"/>
    <g transform="translate(240,86) scale(1.05)" fill="#0c9a83" color="#0c9a83"><circle cx="12" cy="12" r="2"/><ellipse cx="12" cy="12" rx="9" ry="3.6" fill="none" stroke="currentColor" stroke-width="1.6"/><ellipse cx="12" cy="12" rx="9" ry="3.6" fill="none" stroke="currentColor" stroke-width="1.6" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9" ry="3.6" fill="none" stroke="currentColor" stroke-width="1.6" transform="rotate(120 12 12)"/></g>
  </g>
  <circle cx="70" cy="70" r="5" fill="#0c9a83" opacity=".5"/>
  <circle cx="86" cy="52" r="3" fill="#0c9a83" opacity=".4"/>
</svg>
