<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" role="img" aria-label="Illustration of a student working on a laptop">
  <defs>
    <linearGradient id="soc-analyst-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1e6" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff1e6" stop-opacity=".35"/>
    </linearGradient>
    <filter id="soc-analyst-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#c2410c" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="320" height="260" fill="url(#soc-analyst-bg)"/>
  <circle cx="248" cy="46" r="58" fill="#c2410c" opacity=".08"/>
  <circle cx="46" cy="214" r="46" fill="#c2410c" opacity=".08"/>

  <!-- desk -->
  <ellipse cx="160" cy="222" rx="118" ry="10" fill="#c2410c" opacity=".12"/>
  <rect x="34" y="206" width="252" height="14" rx="7" fill="#1c2230"/>

  <!-- person -->
  <path d="M100,208 C100,156 126,120 160,120 C194,120 220,156 220,208 Z" fill="#f0653a"/>
  <path d="M148,208 L148,168 C148,160 153,155 160,155 C167,155 172,160 172,168 L172,208 Z" fill="#c2410c"/>
  <circle cx="160" cy="92" r="21" fill="#f1c27d"/>
  <circle cx="152" cy="94" r="1.7" fill="#20242c"/><circle cx="168" cy="94" r="1.7" fill="#20242c"/><path d="M154,101 Q160,104 166,101" stroke="#20242c" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M137,122 C133,86 144,60 160,60 C176,60 187,86 183,122 C183,128 175,126 172,118 L172,91 A12,12 0 0 0 148,91 L148,118 C145,126 137,128 137,122 Z" fill="#5b3a29"/><clipPath id="soc-analyst-hair-clip"><circle cx="160" cy="92" r="21.5"/></clipPath><rect x="135" y="65" width="50" height="30" fill="#5b3a29" clip-path="url(#soc-analyst-hair-clip)"/>

  <!-- laptop -->
  <g filter="url(#soc-analyst-shadow)">
    <rect x="118" y="108" width="84" height="60" rx="7" fill="#161b26"/>
    <rect x="123" y="113" width="74" height="50" rx="3" fill="#ffffff"/>
    <g transform="translate(140,114) scale(1.7)" fill="#c2410c"><path d="M12 2v3.2A6.8 6.8 0 0 1 18.8 12H22a10 10 0 0 0-10-10Zm0 6.5A3.5 3.5 0 1 0 15.5 12 3.5 3.5 0 0 0 12 8.5ZM12 2A10 10 0 0 0 2 12h3.2A6.8 6.8 0 0 1 12 5.2Zm0 16.8A6.8 6.8 0 0 1 5.2 12H2a10 10 0 0 0 10 10Zm0 0A10 10 0 0 0 22 12h-3.2A6.8 6.8 0 0 1 12 18.8Z"/></g>
    <path d="M108,168 L212,168 L222,182 C222,186 218,188 214,188 L106,188 C102,188 98,186 98,182 Z" fill="#20242c"/>
  </g>

  <!-- floating badge -->
  <g filter="url(#soc-analyst-shadow)">
    <circle cx="252" cy="98" r="24" fill="#ffffff"/>
    <g transform="translate(240,86) scale(1.05)" fill="#c2410c" color="#c2410c"><path d="M12 2v3.2A6.8 6.8 0 0 1 18.8 12H22a10 10 0 0 0-10-10Zm0 6.5A3.5 3.5 0 1 0 15.5 12 3.5 3.5 0 0 0 12 8.5ZM12 2A10 10 0 0 0 2 12h3.2A6.8 6.8 0 0 1 12 5.2Zm0 16.8A6.8 6.8 0 0 1 5.2 12H2a10 10 0 0 0 10 10Zm0 0A10 10 0 0 0 22 12h-3.2A6.8 6.8 0 0 1 12 18.8Z"/></g>
  </g>
  <circle cx="70" cy="70" r="5" fill="#c2410c" opacity=".5"/>
  <circle cx="86" cy="52" r="3" fill="#c2410c" opacity=".4"/>
</svg>
